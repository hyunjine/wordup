# GitHub Release 「개발자 노트」 자동 분류 (PR 라벨 기준). .github/workflows/release.yml 이 generate-notes 로 쓴다.
changelog:
  exclude:
    labels:
      - "🚀 Release"
  categories:
    - title: ✨ 새 기능
      labels: ["💻 Feat"]
    - title: 🐛 버그 수정
      labels: ["🛠️ Fix", "🔥 Bug"]
    - title: 🪄 리팩터링
      labels: ["🪄 Refactor"]
    - title: ⚙️ 설정 · 인프라
      labels: ["⚙️ Setting"]
    - title: 기타
      labels: ["*"]
